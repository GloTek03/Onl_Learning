<div class="row">
  <div class="col-12 text-center mb-4">
    <h1>Home Page</h1>
    <p>Welcome to the home page!</p>
    <p>Welcome Son</p>
  </div>

  <div class="col-12 col-sm-6 col-md-4 col-lg-3 mb-4" *ngFor="let course of courseList()">
    <div class="card h-100 shadow-sm">
      <img [src]="course.thumbnailUrl" class="card-img-top" alt="{{ course.courseName }}" />
      <div class="card-body">
        <h5 class="card-title">{{ course.courseName }}</h5>
        <p class="card-text">{{ course.courseDescription }}</p>
      </div>
      <ul class="list-group list-group-flush">
        <li class="list-group-item">
          <strong>Duration:</strong> {{ course.totalHours }}
        </li>
        <li class="list-group-item">
          <strong>Videos:</strong> {{ course.totalVideos }}
        </li>
      </ul>
    </div>
  </div>
</div>
