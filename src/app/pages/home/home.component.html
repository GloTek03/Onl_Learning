<div class="container my-5">
  <div class="row">
    <div class="col-12 text-center mb-4">
      <h1>Home Page</h1>
      <p>Welcome to the home page!</p>
      <p>Welcome Són</p>
    </div>

    <div class="col-md-4 mb-4" *ngFor="let course of courseList()">
      <div class="card h-100 shadow-sm">
        <img [src]="course.thumbnailUrl" class="card-img-top" alt="{{ course.courseName }}" style="height: 200px; object-fit: cover;" />
        <div class="card-body">
          <h5 class="card-title">{{ course.courseName }}</h5>
          <p class="card-text">{{ course.courseDescription }}</p>
        </div>
        <ul class="list-group list-group-flush">
          <li class="list-group-item">
            <strong>Duration:</strong> {{ course.totalHours }}
          </li>
          <li class="list-group-item">
            <strong>Videos:</strong> {{ course.totalVideos }}
          </li>
        </ul>
      </div>
    </div>
  </div>
</div>
